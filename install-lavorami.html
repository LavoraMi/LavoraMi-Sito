<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="L'App che aiuta i pendolari e li informa prima e durante il loro viaggio, sempre. Evita di scoprire scioperi e interruzioni della linea all'ultimo minuto.">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>LavoraMi - Installa l'app!</title>
        <link rel="icon" href="img/icon.webp">
    </head>
    <body>
        <script>
            (function () {
                const APP_STORE_URL = "https://apps.apple.com/us/app/lavorami/id6760344298";
                const PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.andreafilice.lavorami";

                const ua = navigator.userAgent || navigator.vendor || window.opera;
                const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

                const isAndroid = /android/i.test(ua);

                if (isIOS)
                    window.location.replace(APP_STORE_URL);
                else
                    window.location.replace(PLAY_STORE_URL);
            })();
        </script>
    </body>
</html>
